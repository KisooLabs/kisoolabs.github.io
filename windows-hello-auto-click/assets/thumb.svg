<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Windows Hello Auto-Click — the Windows Security dialog with its OK button being confirmed automatically after a face match">
  <defs>
    <linearGradient id="whbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14331d"/>
      <stop offset="1" stop-color="#0d1f14"/>
    </linearGradient>
    <radialGradient id="whglow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#2ea043" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2ea043" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="360" fill="url(#whbg)"/>
  <rect width="640" height="360" fill="url(#whglow)"/>

  <!-- credential dialog -->
  <g>
    <rect x="170" y="54" width="300" height="252" rx="18" fill="#202124" stroke="#ffffff" stroke-opacity="0.10"/>
    <rect x="170" y="54" width="300" height="34" rx="18" fill="#26272b"/>
    <rect x="170" y="72" width="300" height="16" fill="#26272b"/>
    <rect x="188" y="66" width="104" height="9" rx="4.5" fill="#c9c9d2" fill-opacity="0.75"/>

    <!-- recognized face -->
    <circle cx="320" cy="146" r="33" fill="#33363d"/>
    <circle cx="320" cy="146" r="33" fill="none" stroke="#2ea043" stroke-width="3"/>
    <circle cx="320" cy="146" r="42" fill="none" stroke="#2ea043" stroke-width="2" stroke-opacity="0.3"/>
    <circle cx="309" cy="139" r="4" fill="#9aa0aa"/>
    <circle cx="331" cy="139" r="4" fill="#9aa0aa"/>
    <path d="M308 157 q12 9 24 0" fill="none" stroke="#9aa0aa" stroke-width="3" stroke-linecap="round"/>

    <rect x="256" y="196" width="128" height="11" rx="5.5" fill="#f2f2f5" fill-opacity="0.9"/>
    <rect x="238" y="215" width="164" height="9" rx="4.5" fill="#9a9aa4" fill-opacity="0.7"/>

    <!-- buttons: OK is being pressed for you -->
    <rect x="196" y="250" width="120" height="34" rx="8" fill="#2ea043"/>
    <rect x="190" y="244" width="132" height="46" rx="13" fill="none" stroke="#2ea043" stroke-width="2.5" stroke-opacity="0.5"/>
    <path d="M240 267 l10 10 l22 -24" fill="none" stroke="#ffffff" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="330" y="250" width="120" height="34" rx="8" fill="#34363c" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="366" y="264" width="48" height="7" rx="3.5" fill="#d5d5dc" fill-opacity="0.6"/>
  </g>

  <!-- cursor absent: it is confirmed without you -->
  <g opacity="0.85">
    <circle cx="512" cy="180" r="26" fill="#2ea043" fill-opacity="0.16"/>
    <path d="M500 180 l9 9 l17 -19" fill="none" stroke="#2ea043" stroke-width="5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
