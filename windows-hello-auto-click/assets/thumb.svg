<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Windows Hello Auto-Click — the Windows Security dialog after a face match, with its OK button already confirmed.">
  <rect width="640" height="360" fill="#F4F5F7"/>

  <!-- credential dialog -->
  <g>
    <rect x="170" y="46" width="300" height="268" rx="16" fill="#FFFFFF" stroke="#E3E5EA" stroke-width="2"/>
    <path d="M170 84 H470" stroke="#EDEFF2" stroke-width="2"/>
    <rect x="192" y="59" width="96" height="8" rx="4" fill="#C7CBD2"/>

    <!-- recognized face -->
    <circle cx="320" cy="150" r="38" fill="#FFFFFF" stroke="#2EA043" stroke-width="3"/>
    <circle cx="307" cy="142" r="4.5" fill="#B9BEC7"/>
    <circle cx="333" cy="142" r="4.5" fill="#B9BEC7"/>
    <path d="M305 162 q15 12 30 0" fill="none" stroke="#B9BEC7" stroke-width="3.5" stroke-linecap="round"/>

    <!-- greeting lines -->
    <rect x="256" y="206" width="128" height="10" rx="5" fill="#8C919B"/>
    <rect x="238" y="228" width="164" height="8" rx="4" fill="#CFD3DA"/>

    <!-- buttons: OK already confirmed -->
    <rect x="196" y="258" width="122" height="36" rx="9" fill="#2EA043"/>
    <path d="M242 276 l10 10 l22 -23" fill="none" stroke="#FFFFFF" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="328" y="258" width="122" height="36" rx="9" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="2"/>
    <rect x="367" y="272" width="44" height="8" rx="4" fill="#C7CBD2"/>
  </g>
</svg>
