  <rect x="352" y="70" width="252" height="220" rx="14" fill="#FFFFFF" stroke="#1C1917" stroke-opacity=".12"/>
  <path d="M353 84a13 13 0 0 1 13-13h224a13 13 0 0 1 13 13v30H353z" fill="#F1F0EC"/>
